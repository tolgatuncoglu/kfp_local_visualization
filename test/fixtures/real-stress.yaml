pipelineInfo:
  name: stress
root:
  dag:
    tasks:
      cleanup:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-cleanup
        dependentTasks:
        - exit-handler-1
        taskInfo:
          name: cleanup
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        inputs:
          parameters:
            pipelinechannel--p:
              componentInputParameter: p
        taskInfo:
